[project]
name = "briefly"
version = "0.1.0"
description = "Briefly: a Home Assistant news integration"
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component",
  "pytest-bdd>=8",
  "pytest-cov",
  "feedparser>=6.0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
bdd_features_base_dir = "tests/bdd/features"
addopts = "--cov=custom_components.briefly --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]

[tool.coverage.run]
branch = true
source = ["custom_components/briefly"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py313"
line-length = 100
